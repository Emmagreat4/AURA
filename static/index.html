<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AURA // AI HUD Interface</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --bg-color: #080b10;
            --accent-cyan: #00f0ff;
            --card-bg: #111622;
            --text-color: #e0e6ed;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-cyan);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 10px;
            line-height: 1.5;
        }

        .user {
            align-self: flex-end;
            background-color: #1a233a;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .aura {
            align-self: flex-start;
            background-color: var(--card-bg);
            border-left: 3px solid var(--accent-cyan);
        }

        #controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(0, 240, 255, 0.1);
        }

        input {
            flex: 1;
            padding: 14px;
            background-color: var(--card-bg);
            border: 1px solid #232d42;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        button {
            padding: 10px 18px;
            background-color: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mic-btn, .notify-btn {
            background-color: #232d42;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
        }

        .icon {
            width: 16px;
            height: 16px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">AURA // SYSTEM HUD</div>
        <div class="header-actions">
            <button class="notify-btn" onclick="enableNotifications()">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                Alerts
            </button>
            <div class="status-container">
                <div class="status-dot"></div>
                <span id="status">SYSTEM ONLINE</span>
            </div>
        </div>
    </header>

    <div id="chat-window">
        <div class="message aura">AURA web sub-system online. Voice and conversational task sub-routine active.</div>
    </div>

    <div id="controls">
        <button class="mic-btn" onclick="startMic()">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            Speak
        </button>
        <input type="text" id="userInput" placeholder="Ask AURA or set a task..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">
            <svg class="icon" viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            Send
        </button>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('ServiceWorker registered:', reg.scope))
                    .catch(err => console.error('ServiceWorker failure:', err));
            });
        }

        async function enableNotifications() {
            if (!('Notification' in window)) {
                alert('Notifications not supported by this browser.');
                return;
            }
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                const reg = await navigator.serviceWorker.ready;
                reg.showNotification('AURA Systems', {
                    body: 'Task notification sub-system active.',
                    icon: '/static/icon-192.png'
                });
            }
        }

        async function triggerTaskNotification(title) {
            const alertText = `Task alert: ${title} is due now, De Great.`;
            appendMessage('aura', `TASK DUE: ${title}. Execution required now, De Great.`);
            
            if (Notification.permission === 'granted') {
                navigator.serviceWorker.ready.then(reg => {
                    reg.showNotification('AURA TASK ALERT', {
                        body: `Time reached for: ${title}`,
                        icon: '/static/icon-192.png'
                    });
                });
            }

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: alertText })
                });
                const data = await response.json();
                
                if (data.audio_url) {
                    const audio = new Audio(data.audio_url + '?t=' + new Date().getTime());
                    audio.play().catch(() => speakBrowser(alertText));
                } else {
                    speakBrowser(alertText);
                }
            } catch (err) {
                speakBrowser(alertText);
            }
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage(textOverride = null) {
            const input = document.getElementById('userInput');
            const message = textOverride || input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            if (!textOverride) input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                appendMessage('aura', data.text);

                if (data.scheduled_task) {
                    setTimeout(() => {
                        triggerTaskNotification(data.scheduled_task.title);
                    }, data.scheduled_task.run_in_seconds * 1000);
                }

                if (data.audio_url) {
                    const audio = new Audio(data.audio_url + '?t=' + new Date().getTime());
                    audio.onerror = () => speakBrowser(data.text);
                    audio.play().catch(() => speakBrowser(data.text));
                } else {
                    speakBrowser(data.text);
                }

            } catch (err) {
                appendMessage('aura', 'Error connecting to server.');
            }
        }

        function speakBrowser(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        function startMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition not supported in this browser.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            document.getElementById('status').innerText = 'LISTENING...';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('status').innerText = 'SYSTEM ONLINE';
                sendMessage(transcript);
            };

            recognition.onerror = () => {
                document.getElementById('status').innerText = 'SYSTEM ONLINE';
            };

            recognition.start();
        }
    </script>
</body>
</html>
